name: Laravel 11 API tests
on:
  push:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PHP 8.3 and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, curl, fileinfo, openssl, tokenizer, ctype, zip, bcmath, intl, sodium
          tools: composer:v2
          coverage: none
      - name: Show platform diagnostics
        run: |
          php -v
          composer --version
          composer diagnose || true
          php -m
      - name: Download Laravel 11 skeleton without installing dependencies
        run: |
          set -euxo pipefail
          composer create-project laravel/laravel /tmp/laravel-base '11.*' --no-install --no-scripts --no-interaction --prefer-dist --no-progress
      - name: Resolve Laravel dependencies
        working-directory: /tmp/laravel-base
        run: |
          set -euxo pipefail
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress -vv
      - name: Copy project overlay
        run: |
          set -euxo pipefail
          cd /tmp/laravel-base
          cp -a "$GITHUB_WORKSPACE/app/." app/
          cp "$GITHUB_WORKSPACE/routes/api.php" routes/api.php
          cp "$GITHUB_WORKSPACE/tests/Feature/UserApiTest.php" tests/Feature/UserApiTest.php
          cp "$GITHUB_WORKSPACE/bootstrap/app.php" bootstrap/app.php
          cp .env.example .env
          php artisan key:generate
      - name: Execute API feature tests
        working-directory: /tmp/laravel-base
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          APP_ENV: testing
        run: |
          set -euxo pipefail
          php artisan test --filter=UserApiTest
