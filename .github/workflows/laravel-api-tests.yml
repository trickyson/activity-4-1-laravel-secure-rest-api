name: Laravel 11 API tests
on:
  push:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source files
        uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, curl, fileinfo, openssl, tokenizer, ctype, zip, bcmath, intl
          tools: composer:v2
          coverage: none
      - name: Create Laravel 11 and install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          composer create-project laravel/laravel /tmp/laravel-base '^11.0' --no-scripts --no-interaction --prefer-dist --no-progress
          test -f /tmp/laravel-base/vendor/autoload.php
      - name: Copy API code and configure application
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/laravel-base
          cp -a "$GITHUB_WORKSPACE/app/." app/
          cp "$GITHUB_WORKSPACE/routes/api.php" routes/api.php
          cp "$GITHUB_WORKSPACE/tests/Feature/UserApiTest.php" tests/Feature/UserApiTest.php
          cp "$GITHUB_WORKSPACE/bootstrap/app.php" bootstrap/app.php
          cp .env.example .env
          php artisan key:generate
          php artisan package:discover --ansi
      - name: Run Laravel API tests
        shell: bash
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          APP_ENV: testing
        run: |
          set -euxo pipefail
          cd /tmp/laravel-base
          php artisan test --filter=UserApiTest
