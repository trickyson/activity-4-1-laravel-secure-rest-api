name: Laravel API automated tests
on:
  push:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project overlay
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml
          coverage: none
      - name: Build Laravel 11 application and run API tests
        shell: bash
        run: |
          set -euo pipefail
          composer create-project laravel/laravel /tmp/laravel-base "^11.0" --no-interaction --prefer-dist
          cd /tmp/laravel-base
          php artisan install:api --no-interaction
          cp -a "$GITHUB_WORKSPACE/app/." app/
          cp "$GITHUB_WORKSPACE/routes/api.php" routes/api.php
          cp "$GITHUB_WORKSPACE/tests/Feature/UserApiTest.php" tests/Feature/UserApiTest.php
          cp .env.example .env
          php artisan key:generate
          DB_CONNECTION=sqlite DB_DATABASE=:memory: php artisan test --filter=UserApiTest
